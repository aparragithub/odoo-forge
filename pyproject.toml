[project]
name = "odoo-forge-toolkit"
version = "0.1.1"
description = "Pure Pydantic domain + CLI for composing decentralized Odoo project manifests"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Angel Parra", email = "607418+aparragithub@users.noreply.github.com" },
]
keywords = ["odoo", "erp", "docker", "deployment", "manifest", "devops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=43.0",
    "fastapi>=0.115,<0.142",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/aparragithub/odoo-forge"
Repository = "https://github.com/aparragithub/odoo-forge"
Documentation = "https://github.com/aparragithub/odoo-forge/blob/main/docs/00-master-index.md"
Changelog = "https://github.com/aparragithub/odoo-forge/blob/main/CHANGELOG.md"
Issues = "https://github.com/aparragithub/odoo-forge/issues"

[project.scripts]
forge = "odoo_forge_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odoo_forge", "src/odoo_forge_cli", "src/odoo_forge_git", "src/odoo_forge_workspace", "src/odoo_forge_docker", "src/odoo_forge_registry", "src/odoo_forge_postgres_docker", "src/odoo_forge_catalog", "src/odoo_forge_pipeline_github", "src/odoo_forge_instances_postgres", "src/odoo_forge_server", "src/odoo_forge_identity_github"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
    "mypy>=1.10",
    "ruff>=0.16.0",
    "types-PyYAML>=6.0",
]

[tool.uv]
# Starlette is transitive through FastAPI, which sets no upper bound. Pin the
# floor here rather than in `dependencies`: nothing in this project imports
# starlette, so it is a resolution constraint, not a dependency we own.
# Below 1.3.1 the resolver is free to pick a release carrying the form-limit
# bypass, the UNC-path SSRF, the Range-header DoS, and the Host-header path
# poisoning.
constraint-dependencies = ["starlette>=1.3.1"]

[tool.pytest.ini_options]
testpaths = ["tests", "docs/tools/platform_portfolio"]
addopts = "-m 'not integration' --cov=odoo_forge --cov-report=term-missing"
markers = [
    "integration: real-daemon-only backend tests (PG socket-vs-TCP race, ephemeral-port assignment, health timing); deselected by default, run explicitly with `-m integration`",
    "real_docker: isolated Docker PostgreSQL database-adapter acceptance tests; deselected by default, run explicitly with `-m real_docker`",
]

[tool.coverage.run]
source = ["odoo_forge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
# ruff 0.16 formats Python code blocks inside Markdown. Most of the affected
# files are archived design documents under openspec/changes/archive/ — dated
# records of past decisions, which a formatter released afterwards is no reason
# to rewrite. Linting is unaffected: format.exclude applies to formatting only.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["validate"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["odoo_forge", "odoo_forge_cli", "odoo_forge_git", "odoo_forge_workspace", "odoo_forge_docker", "odoo_forge_registry", "odoo_forge_postgres_docker", "odoo_forge_catalog", "odoo_forge_pipeline_github", "odoo_forge_instances_postgres"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core never imports infrastructure or framework"
type = "forbidden"
source_modules = ["odoo_forge"]
forbidden_modules = [
    "docker",
    "boto3",
    "kubernetes",
    "git",
    "typer",
    "subprocess",
    "requests",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Core never imports the CLI"
type = "forbidden"
source_modules = ["odoo_forge"]
forbidden_modules = ["odoo_forge_cli"]

[[tool.importlinter.contracts]]
name = "Core never imports the git adapter"
type = "forbidden"
source_modules = ["odoo_forge"]
forbidden_modules = ["odoo_forge_git"]

[[tool.importlinter.contracts]]
name = "Core never imports the workspace adapter"
type = "forbidden"
source_modules = ["odoo_forge"]
forbidden_modules = ["odoo_forge_workspace"]

[[tool.importlinter.contracts]]
name = "Core never imports the docker adapter"
type = "forbidden"
source_modules = ["odoo_forge"]
forbidden_modules = ["odoo_forge_docker"]

[[tool.importlinter.contracts]]
name = "Core never imports the registry adapter"
type = "forbidden"
source_modules = ["odoo_forge"]
forbidden_modules = ["odoo_forge_registry"]

[[tool.importlinter.contracts]]
name = "Core never imports the catalog adapter"
type = "forbidden"
source_modules = ["odoo_forge"]
forbidden_modules = ["odoo_forge_catalog"]

[[tool.importlinter.contracts]]
name = "Core never imports the pipeline github adapter"
type = "forbidden"
source_modules = ["odoo_forge"]
forbidden_modules = ["odoo_forge_pipeline_github"]

[[tool.importlinter.contracts]]
name = "Core never imports the postgres-docker adapter"
type = "forbidden"
source_modules = ["odoo_forge"]
forbidden_modules = ["odoo_forge_postgres_docker"]

[[tool.importlinter.contracts]]
name = "Core never imports the instances-postgres adapter"
type = "forbidden"
source_modules = ["odoo_forge"]
forbidden_modules = ["odoo_forge_instances_postgres"]
